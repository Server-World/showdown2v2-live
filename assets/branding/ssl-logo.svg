<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Supersonic Showdown League 2v2 bot logo</title>
  <desc id="desc">Large SS shield logo with blue car, orange flames, and soccer ball.</desc>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25364f"/>
      <stop offset="0.55" stop-color="#111d31"/>
      <stop offset="1" stop-color="#06101d"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.52" stop-color="#b7c4d3"/>
      <stop offset="1" stop-color="#657487"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65dcff"/>
      <stop offset="0.5" stop-color="#20aeea"/>
      <stop offset="1" stop-color="#0878b7"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b1f"/>
      <stop offset="0.45" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="none"/>

  <g filter="url(#shadow)">
    <path d="M512 57 879 169v364c0 203-139 344-367 434C284 877 145 736 145 533V169L512 57Z" fill="url(#shield)" stroke="#f5fbff" stroke-width="12"/>
    <path d="M512 88 845 190v337c0 177-116 301-333 388-217-87-333-211-333-388V190L512 88Z" fill="none" stroke="#4c5d74" stroke-width="14"/>

    <!-- Large SS letters matching the supplied bot-logo direction -->
    <g fill="url(#silver)" stroke="#07101d" stroke-width="18" stroke-linejoin="round">
      <path d="M204 178h282v93H317v58h149c56 0 91 35 91 89v79c0 61-42 101-106 101H204v-95h241v-66H294c-57 0-90-34-90-89V178Z"/>
      <path d="M538 178h282v93H651v58h149c56 0 91 35 91 89v79c0 61-42 101-106 101H538v-95h241v-66H628c-57 0-90-34-90-89V178Z"/>
    </g>
    <g opacity=".65" fill="#ffffff">
      <path d="M232 205h227v34H264v99h-32z"/>
      <path d="M566 205h227v34H598v99h-32z"/>
    </g>

    <!-- Flame trail -->
    <path d="M68 571c119-13 177-65 237-120-25 60-76 94-122 123 82-15 145-60 203-119-20 50-58 91-102 123 86-13 155-50 211-116-11 53-42 95-83 130 93-10 179-42 259-103 108-83 176-63 244-12-77-11-141 10-197 51-105 76-220 109-358 106-113-2-209-22-292-63Z" fill="url(#flame)" stroke="#07101d" stroke-width="8" stroke-linejoin="round"/>
    <path d="M163 574c77-10 142-38 207-92-23 39-56 67-94 91 96-9 178-44 248-101-20 40-52 75-95 105 86-9 166-37 239-87 66-46 120-53 172-24-69 5-122 35-176 70-111 72-245 91-501 38Z" fill="#ffd166" opacity=".9"/>

    <!-- Car body -->
    <g stroke="#07101d" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
      <path d="M286 517 402 395h204l112 111 92 26 42 68-90 36H292l-99-34 52-63 41-22Z" fill="url(#car)"/>
      <path d="M420 412h162l79 79H344l76-79Z" fill="#9befff"/>
      <path d="M433 430h72v61H377l56-61Zm94 0h45l59 61H527v-61Z" fill="#07101d" opacity=".82"/>
      <path d="M278 515h102l-38 56H221l57-56Zm438 0h92l32 48-109 20-15-68Z" fill="#1ec8ff"/>
      <circle cx="350" cy="626" r="72" fill="#07101d"/>
      <circle cx="350" cy="626" r="44" fill="#ff9f43"/>
      <circle cx="350" cy="626" r="24" fill="#101f35"/>
      <circle cx="724" cy="626" r="72" fill="#07101d"/>
      <circle cx="724" cy="626" r="44" fill="#ff9f43"/>
      <circle cx="724" cy="626" r="24" fill="#101f35"/>
      <path d="M258 633h558" stroke="#ff9f43" stroke-width="11"/>
    </g>

    <!-- Soccer ball -->
    <g transform="translate(512 746)">
      <circle r="74" fill="#f7fbff" stroke="#07101d" stroke-width="10"/>
      <polygon points="0,-34 32,-11 20,28 -20,28 -32,-11" fill="#07101d"/>
      <path d="M0-34v-34M32-11l55-18M20 28l35 48M-20 28l-35 48M-32-11l-55-18" stroke="#07101d" stroke-width="9"/>
      <path d="M-55-50c-14 17-22 39-22 62M55-50c14 17 22 39 22 62M-47 58c29 20 65 20 94 0" stroke="#07101d" stroke-width="8" fill="none"/>
    </g>
  </g>
</svg>
