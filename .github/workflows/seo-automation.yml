name: SEO static render and IndexNow

on:
  push:
    branches: [main]
    paths:
      - "data/league.json"
      - "data/player-card-hitman.json"
      - "**/*.html"
      - "**/*.js"
      - "site-audit.css"
      - "sitemap.xml"
      - "assets/branding/ssl-social-card.svg"
      - "scripts/seo_static.py"
      - ".github/workflows/seo-automation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimize:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[seo-static]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare current sanitized league snapshot
        run: cp data/league.json league.json

      - name: Render crawlable league snapshots and metadata
        run: python3 scripts/seo_static.py

      - name: Normalize final CSS cascade
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pages = [
              Path("index.html"),
              Path("matches/index.html"),
              Path("standings/index.html"),
              Path("teams/index.html"),
              Path("players/index.html"),
              Path("stats/index.html"),
              Path("history/index.html"),
              Path("league/index.html"),
              Path("news/index.html"),
              Path("404.html"),
          ]
          audit = '<link rel="stylesheet" href="/site-audit.css">'
          preferred = '<link rel="stylesheet" href="/competition-fixes.css">'
          fallback = '<link rel="stylesheet" href="/production.css">'
          for path in pages:
              text = path.read_text(encoding="utf-8").replace(audit, "")
              if preferred in text:
                  text = text.replace(preferred, preferred + audit, 1)
              elif fallback in text:
                  text = text.replace(fallback, fallback + audit, 1)
              else:
                  text = text.replace('</head>', audit + '</head>', 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Validate generated files and runtime syntax
        run: |
          python3 -m json.tool data/league.json >/dev/null
          python3 -m json.tool data/player-card-hitman.json >/dev/null
          python3 -m py_compile scripts/seo_static.py
          node --check site-v2.js
          node --check player-card-demo.js
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          ET.parse("sitemap.xml")
          public_pages = [
              "index.html",
              "matches/index.html",
              "standings/index.html",
              "teams/index.html",
              "players/index.html",
              "stats/index.html",
              "history/index.html",
              "league/index.html",
              "news/index.html",
          ]
          for name in public_pages:
              path = pathlib.Path(name)
              text = path.read_text(encoding="utf-8")
              assert '<link rel="canonical"' in text, path
              assert '<meta name="description"' in text, path
              assert 'property="og:image"' in text, path
              assert 'name="twitter:image"' in text, path
              assert 'rel="manifest"' in text, path
              assert text.count('href="/site-audit.css"') == 1, (path, text.count('href="/site-audit.css"'))
              assert text.count('GTM-P65S83G6') == 2, (path, text.count('GTM-P65S83G6'))
          not_found = pathlib.Path("404.html").read_text(encoding="utf-8")
          assert not_found.count('GTM-P65S83G6') == 2
          assert not_found.count('href="/site-audit.css"') == 1
          print("SEO/runtime validation passed")
          PY
          if grep -R "G-N4H6G9T2L2" --include='*.html' --include='*.js' .; then
            echo "Legacy GA4 ID must not exist in site source"
            exit 1
          fi
          if grep -R "googletagmanager.com/gtag/js" --include='*.html' --include='*.js' .; then
            echo "Standalone gtag.js must not be deployed outside GTM"
            exit 1
          fi
          git diff --check

      - name: Commit generated static SEO content
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html matches/index.html standings/index.html teams/index.html players/index.html stats/index.html history/index.html league/index.html news/index.html 404.html sitemap.xml
          git commit -m "[seo-static] Render crawlable league snapshots"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Notify IndexNow search engines
        continue-on-error: true
        env:
          INDEXNOW_KEY: a5996eb1e9a87c85ca184f9925765c72
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request, xml.etree.ElementTree as ET
          host = "showdown2v2.live"
          key = os.environ["INDEXNOW_KEY"]
          root = ET.parse("sitemap.xml").getroot()
          ns = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [n.text for n in root.findall("s:url/s:loc", ns) if n.text]
          payload = json.dumps({
              "host": host,
              "key": key,
              "keyLocation": f"https://{host}/{key}.txt",
              "urlList": urls,
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("IndexNow response:", response.status)
          except urllib.error.HTTPError as exc:
              print("IndexNow HTTP response:", exc.code, exc.read().decode("utf-8", "replace"))
          except Exception as exc:
              print("IndexNow notification warning:", exc)
          PY
