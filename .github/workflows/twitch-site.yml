name: Twitch site integration

on:
  workflow_run:
    workflows: ["SEO static render and IndexNow"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Twitch integration
        run: python3 scripts/twitch_static.py
      - name: Validate JavaScript
        run: |
          node --check twitch-site.js
          node --check watch.js
          python3 -m py_compile scripts/twitch_static.py
      - name: Validate Twitch surface
        run: |
          grep -q 'supersonicshowdownleague' watch/index.html
          grep -q 'https://showdown2v2.live/watch/' sitemap.xml
          grep -q 'GTM-P65S83G6' watch/index.html
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html matches/index.html standings/index.html teams/index.html players/index.html stats/index.html history/index.html league/index.html news/index.html 404.html watch/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Twitch integration already current."
            exit 0
          fi
          git commit -m "[twitch] Publish SSL watch integration"
          git pull --rebase origin main
          git push origin main
