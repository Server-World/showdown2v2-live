name: Growth Join Route CI

on:
  pull_request:
    paths:
      - 'join/**'
      - 'join-config.json'
      - 'tests/join-route.test.mjs'
      - 'package.json'
      - '.github/workflows/growth-join-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
